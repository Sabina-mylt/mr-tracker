<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MR Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar + tab row; one content column (max 1080px); detail opens as a bottom sheet on phones, side panel on desktop. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --sunk: #e9ece7;
  --line: #d9ded6;
  --ink: #17211d;
  --muted: #5d6a63;
  --accent: #1d5f4f;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe5;

  --s-new: #7b8580;      --s-new-bg: #eceeec;
  --s-contacted: #2f63b8; --s-contacted-bg: #e2eafa;
  --s-offer: #6d4bb5;    --s-offer-bg: #ece6f8;
  --s-nego: #a86400;     --s-nego-bg: #fbeed8;
  --s-yes: #1f7a3f;      --s-yes-bg: #ddf1e3;
  --s-no: #b23a35;       --s-no-bg: #f8e1df;
  --warn: #a86400; --warn-bg: #fbeed8;
  --bad: #b23a35;  --bad-bg: #f8e1df;
  --good: #1f7a3f; --good-bg: #ddf1e3;

  --f-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111715; --surface: #18201d; --sunk: #0d1311; --line: #2a3531; --ink: #e6ece8; --muted: #93a19a;
    --accent: #5fbf9f; --accent-ink: #0d1311; --accent-soft: #1d3a31;
    --s-new: #a3ada8; --s-new-bg: #252d2a;
    --s-contacted: #8db3f5; --s-contacted-bg: #1d2a42;
    --s-offer: #b9a1ef; --s-offer-bg: #2a2340;
    --s-nego: #f0b453; --s-nego-bg: #3a2c14;
    --s-yes: #6fd394; --s-yes-bg: #173523;
    --s-no: #f08a84; --s-no-bg: #3d1f1d;
    --warn: #f0b453; --warn-bg: #3a2c14; --bad: #f08a84; --bad-bg: #3d1f1d; --good: #6fd394; --good-bg: #173523;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.top-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; min-height: 56px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.me { display: flex; align-items: center; gap: 8px; }
.me-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 6px; display: flex; align-items: center; gap: 8px; font-weight: 500; }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
select.proj { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; }
.tabs { max-width: 1080px; margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 10px 12px 11px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-family: var(--f-num); font-size: 12px; background: var(--sunk); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
.tab .count.hot { background: var(--bad-bg); color: var(--bad); }

.banner { max-width: 1080px; margin: 12px auto 0; background: var(--warn-bg); color: var(--warn); border-radius: var(--r); padding: 8px 12px; font-size: 13px; display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.banner button { border: 0; background: none; color: inherit; text-decoration: underline; padding: 0; }

main { max-width: 1080px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; margin: 24px 0 8px; display: flex; align-items: center; gap: 8px; }
h2:first-child { margin-top: 4px; }
h2 .pill { text-transform: none; letter-spacing: 0; }
.lede { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 4px 0 4px; text-wrap: balance; }

/* stage pills */
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-New { color: var(--s-new); background: var(--s-new-bg); }
.st-Contacted { color: var(--s-contacted); background: var(--s-contacted-bg); }
.st-Offer { color: var(--s-offer); background: var(--s-offer-bg); }
.st-Negotiating { color: var(--s-nego); background: var(--s-nego-bg); }
.st-Confirmed { color: var(--s-yes); background: var(--s-yes-bg); }
.st-Refused { color: var(--s-no); background: var(--s-no-bg); }
.chip { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.flag { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.flag.bad { color: var(--bad); background: var(--bad-bg); }
.flag.warn { color: var(--warn); background: var(--warn-bg); }

/* company cards */
.list { display: grid; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; width: 100%; align-items: start; }
.card:hover { border-color: var(--accent); }
.card .name { font-weight: 600; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.card .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.card .next { grid-column: 1 / -1; font-size: 13px; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 20px; color: var(--muted); text-align: center; }
.empty strong { color: var(--ink); display: block; margin-bottom: 4px; }

/* buttons & inputs */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn:disabled { opacity: .55; cursor: default; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 11px; }
textarea.input { resize: vertical; min-height: 64px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar .input { width: auto; flex: 1 1 200px; min-width: 0; }
.toolbar select.input { flex: 0 1 160px; }

/* all companies table */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--sunk); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--sunk); }
td.co { font-weight: 600; min-width: 160px; }
td .sub { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.show-more { margin-top: 10px; }

/* dashboard */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.kpi .v { font-family: var(--f-num); font-size: 26px; font-weight: 500; line-height: 1.1; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .d { font-size: 12px; margin-top: 4px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }
.funnel-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 48px; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; }
.bar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--sunk); }
.bar span { display: block; height: 100%; }
.bar .b-New { background: var(--s-new); opacity: .35; }
.bar .b-Contacted { background: var(--s-contacted); }
.bar .b-Offer { background: var(--s-offer); }
.bar .b-Negotiating { background: var(--s-nego); }
.bar .b-Confirmed { background: var(--s-yes); }
.bar .b-Refused { background: var(--s-no); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 72px; margin-top: 6px; }
.spark div { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
.spark div.today { opacity: 1; outline: 2px solid var(--accent-soft); }
.spark-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
.people td.who { font-weight: 600; white-space: nowrap; }
.people td.who .avatar { display: inline-grid; vertical-align: middle; margin-right: 8px; }
.ago-good { color: var(--good); } .ago-warn { color: var(--warn); } .ago-bad { color: var(--bad); font-weight: 600; }

/* activity */
.feed { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.ev { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: start; }
.ev:last-child { border-bottom: 0; }
.ev .what { overflow-wrap: anywhere; }
.ev .what b { font-weight: 600; }
.ev .note { color: var(--muted); font-size: 13px; margin-top: 2px; white-space: pre-wrap; }
.ev .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
.daysep { padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--sunk); border-bottom: 1px solid var(--line); }
.daysep:first-child { border-radius: var(--r) var(--r) 0 0; }

/* sheet / dialog */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 14, .45); z-index: 40; display: flex; justify-content: flex-end; }
.sheet { background: var(--bg); width: min(520px, 100%); height: 100%; overflow-y: auto; box-shadow: -8px 0 30px rgba(0,0,0,.15);
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px; display: grid; gap: 16px; align-content: start; }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.sheet-head h3 { margin: 0; font-size: 22px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.close { border: 0; background: var(--sunk); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; flex: none; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.box-title { font-weight: 600; font-size: 14px; }
.contact { display: flex; gap: 8px; align-items: start; }
.contact .val { flex: 1; user-select: all; overflow-wrap: anywhere; font-size: 14px; }
.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.act { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 6px; font-size: 13px; font-weight: 600; display: grid; gap: 2px; justify-items: center; }
.act small { font-weight: 400; color: var(--muted); font-size: 11px; }
.act[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.act.yes[aria-pressed="true"] { border-color: var(--s-yes); background: var(--s-yes-bg); color: var(--s-yes); }
.act.no[aria-pressed="true"] { border-color: var(--s-no); background: var(--s-no-bg); color: var(--s-no); }
.stages { display: flex; flex-wrap: wrap; gap: 6px; }
.stages button { border: 1px solid var(--line); background: var(--surface); }
.stages button[aria-pressed="true"] { border-color: currentColor; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 8px; }
.hist { display: grid; gap: 8px; font-size: 13px; }
.hist .h { border-left: 2px solid var(--line); padding-left: 10px; }
.owner-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }

/* gate */
.gate { max-width: 420px; margin: 8vh auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 14px; }
.gate h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
.people-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.people-pick button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 10px; text-align: left; display: flex; gap: 8px; align-items: center; font-weight: 500; min-width: 0; }
.people-pick button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.err { color: var(--bad); font-size: 13px; }

/* comments */
.composer { display: grid; gap: 10px; margin-bottom: 16px; }
.composer .row2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.cmt { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.cmt.done { opacity: .7; }
.cmt.unread { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.cmt-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.cmt-head .when { color: var(--muted); font-size: 12px; margin-left: auto; }
.cmt-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.cmt-co { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; text-align: left; }
.replies { display: grid; gap: 6px; border-left: 2px solid var(--line); padding-left: 12px; margin-left: 4px; }
.reply { font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
.reply .muted { font-size: 12px; }
.reply-form { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.reply-form .input { flex: 1 1 180px; min-width: 0; padding: 7px 10px; }
.nudge { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--accent-soft); color: var(--accent); border-radius: var(--r); padding: 10px 14px; margin: 8px 0 4px; font-weight: 600; font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 500; z-index: 60; font-size: 14px; max-width: calc(100% - 32px); }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }

@media (max-width: 820px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis .kpi:first-child { grid-column: 1 / -1; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 600px) {
  .scrim { align-items: flex-end; }
  .sheet { height: auto; max-height: 92vh; border-radius: 16px 16px 0 0; width: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hide-sm { display: none; }
  .funnel-row { grid-template-columns: 90px minmax(0, 1fr) 40px; }
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .brand span.full { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .sheet.enter { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(24px); opacity: .6; } }
}
</style>

<script>
(function () {
'use strict';

/* ================= constants ================= */
var CFG = window.MR_CONFIG || {};
var API = (CFG.API_URL || '').trim();
var DEMO = !API;
var STAGES = ['New', 'Contacted', 'Offer sent', 'Negotiating', 'Confirmed', 'Refused'];
var OPEN = ['Contacted', 'Offer sent', 'Negotiating'];
var CLOSED = ['Confirmed', 'Refused'];
var STALE = CFG.STALE_DAYS || 5;
var DIRS = CFG.DIRECTIONS || ['Infopartners', 'RnR', 'Coffee-break', 'EWD', 'Speakers'];
var PROJECTS = CFG.PROJECTS || ['GoX'];
// "What did you just do?" — one tap logs the action and moves the stage forward
var ACTIONS = [
  { a: 'Called', stage: 'Contacted', hint: 'cold call' },
  { a: 'Messaged', stage: 'Contacted', hint: 'DM / email' },
  { a: 'Sent offer', stage: 'Offer sent', hint: 'commercial offer' },
  { a: 'Followed up', stage: 'Negotiating', hint: 'reminder' },
  { a: 'They agreed', stage: 'Confirmed', hint: 'partner!', cls: 'yes' },
  { a: 'They refused', stage: 'Refused', hint: 'closed', cls: 'no' }
];

/* ================= state ================= */
var S = {
  companies: [], log: [], team: [], comments: [], cFilter: 'open',
  me: '', role: '',
  token: store('mrt-token') || '',
  loginList: null, authMode: 'login', confirm: null, resetResult: null,
  code: store('mrt-code') || '',
  view: (location.hash || '#my').slice(1),
  project: store('mrt-project') || 'All',
  q: '', fDir: 'All', fStage: 'All', fOwner: 'All', limit: 60,
  open: null, draft: null, loaded: false, error: '', busy: false
};

function store(k, v) {
  try {
    if (arguments.length === 1) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) { return null; }
}

/* ================= data layer ================= */
// GET {action:'team'} = names for the login screen (needs the team code)
// GET (data)          = everything, for a logged-in person (needs the session token)
// POST                = login/register (team code + PIN) or any change (session token)
function api(method, payload) {
  payload = payload || {};
  var p;
  if (DEMO) {
    p = Promise.resolve().then(function () { return demoApi(method, payload); });
  } else if (method === 'GET') {
    var a = payload.action || 'data';
    p = fetch(API + '?action=' + a + (a === 'team' ? '&code=' + encodeURIComponent(S.code) : '&token=' + encodeURIComponent(S.token)), { redirect: 'follow' })
      .then(function (r) { return r.json(); });
  } else {
    payload.token = S.token; payload.code = S.code;
    // text/plain avoids a CORS preflight, which Apps Script does not answer
    p = fetch(API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); });
  }
  return p.then(function (j) {
    if (!j.ok) { var e = new Error(errText(j.error)); e.code = j.error; throw e; }
    return j;
  });
}

function errText(code) {
  return ({
    WRONG_CODE: 'That team code is not right. Ask the head for the current one.',
    WRONG_PIN: 'Wrong PIN. Check it and try again.',
    LOCKED: 'Too many wrong PINs. Wait 15 minutes, or ask the admin to reset your PIN.',
    NO_PIN: 'This account has no PIN yet. Choose "Create account" and use exactly this name to set one.',
    FORBIDDEN: 'Only the admin or the head can do that.',
    BAD_SESSION: 'You were logged out. Please log in again.'
  })[code] || code || 'Request failed';
}

function setSession(token, me) {
  S.token = token; store('mrt-token', token);
  if (me) { S.me = me.name; S.role = me.role; store('mrt-last', me.name); }
}

function logoutLocal(msg) {
  S.token = ''; store('mrt-token', null); S.me = ''; S.role = ''; S.open = null;
  S.companies = []; S.log = []; S.comments = []; S.team = []; S.loginList = null; S.authMode = 'login';
  S.error = msg || '';
}

function load(quiet) {
  if (!DEMO && !S.code) { S.loaded = true; render(); return Promise.resolve(); }
  if (!S.token) {
    return api('GET', { action: 'team' }).then(function (d) {
      S.loginList = d; S.loaded = true;
      if (d.needsAdmin) S.authMode = 'register';
      render();
    }).catch(fail);
  }
  return api('GET').then(function (d) {
    S.me = d.me.name; S.role = d.me.role;
    S.companies = d.companies; S.log = d.log; S.team = d.team; S.comments = d.comments || []; S.loaded = true; S.error = '';
    render();
  }).catch(fail);

  function fail(e) {
    S.loaded = true;
    if (e.code === 'WRONG_CODE') { S.code = ''; store('mrt-code', null); logoutLocal(e.message); render(); return; }
    if (e.code === 'BAD_SESSION') { logoutLocal(e.message); return load(); }
    if (!quiet) S.error = 'Could not reach the tracker: ' + e.message + '. Check your connection and reload.';
    render();
  }
}

function save(payload, okMsg) {
  S.busy = true; renderSheet();
  return api('POST', payload).then(function (res) {
    S.busy = false;
    if (res.company) {
      var i = S.companies.findIndex(function (c) { return c.id === res.company.id; });
      if (i >= 0) S.companies[i] = res.company; else S.companies.push(res.company);
    }
    if (okMsg) toast(okMsg);
    load(true);
    return res;
  }).catch(function (e) {
    S.busy = false;
    if (e.code === 'BAD_SESSION' || e.code === 'WRONG_CODE') { logoutLocal(e.message); load(); }
    else { renderSheet(); toast('Not saved: ' + e.message); }
    throw e;
  });
}

/* ================= demo mode ================= */
// Mirrors backend/Code.gs closely enough to try every screen. Every demo PIN starts as 1111.
function demoApi(method, p) {
  var db = demoDb();
  var now = new Date().toISOString();
  var err = function (m) { return { ok: false, error: m }; };
  var find = function (n) { return db.team.find(function (m) { return m.name.toLowerCase() === String(n || '').trim().toLowerCase(); }); };
  var pinOf = function (m) { return m.pin || '1111'; };
  var pinOk = function (x) { return /^[A-Za-z0-9]{4,12}$/.test(String(x || '')); };
  var rank = { Raiser: 1, Tracker: 2, Admin: 3 };

  if (method === 'GET' && p.action === 'team') {
    var act = db.team.filter(function (m) { return m.active !== 'no'; });
    return { ok: true, team: act.map(function (m) { return { name: m.name, role: m.role, hasPin: true }; }), needsAdmin: !act.some(function (m) { return m.role === 'Admin'; }) };
  }
  if (p.action === 'login') {
    var lm = find(p.name);
    if (!lm || lm.active === 'no') return err('No active account with that name. Register first, or ask the admin.');
    if (pinOf(lm) !== p.pin) return err('WRONG_PIN');
    return { ok: true, token: 'demo:' + lm.name, me: { name: lm.name, role: lm.role } };
  }
  if (p.action === 'register') {
    var nm = String(p.name || '').trim().replace(/\s+/g, ' ');
    if (nm.length < 2) return err('Enter your name and surname (2–40 letters).');
    if (!pinOk(p.pin)) return err('The PIN must be 4–12 letters or digits.');
    if (find(nm)) return err('This name is already registered. Log in instead, or pick another name.');
    var hasAdmin = db.team.some(function (m) { return m.role === 'Admin' && m.active !== 'no'; });
    var nr = { name: nm, role: hasAdmin ? 'Raiser' : 'Admin', active: 'yes', pin: p.pin };
    db.team.push(nr); demoDb(db);
    return { ok: true, token: 'demo:' + nm, me: { name: nm, role: nr.role } };
  }

  var me = find(String(S.token || '').replace(/^demo:/, ''));
  if (!me || me.active === 'no') return err('BAD_SESSION');
  var lead = rank[me.role] >= 2, admin = me.role === 'Admin';

  if (method === 'GET') return {
    ok: true, me: { name: me.name, role: me.role }, companies: db.companies, log: db.log.slice(-400), comments: db.comments,
    team: db.team.filter(function (m) { return admin || m.active !== 'no'; }).map(function (m) { return { name: m.name, role: m.role, active: m.active || 'yes', hasPin: true }; })
  };

  switch (p.action) {
    case 'logout': return { ok: true };
    case 'changePin':
      if (pinOf(me) !== p.oldPin) return err('WRONG_PIN');
      if (!pinOk(p.newPin)) return err('The PIN must be 4–12 letters or digits.');
      me.pin = p.newPin; demoDb(db); return { ok: true };
    case 'setRole': case 'resetPin': case 'setActive': {
      if (!admin) return err('FORBIDDEN');
      var t = find(p.name); if (!t) return err('Person not found');
      var admins = db.team.filter(function (m) { return m.role === 'Admin' && m.active !== 'no'; }).length;
      if (p.action === 'setRole') {
        if (t.role === 'Admin' && p.role !== 'Admin' && admins <= 1) return err('You are the only admin. Make someone else admin first.');
        t.role = p.role; demoDb(db); return { ok: true };
      }
      if (p.action === 'resetPin') { t.pin = String(Math.floor(1000 + Math.random() * 9000)); demoDb(db); return { ok: true, pin: t.pin }; }
      if (p.active === 'no') {
        if (t.name === me.name) return err('You cannot remove yourself.');
        if (t.role === 'Admin' && admins <= 1) return err('This is the only admin.');
      }
      t.active = p.active === 'yes' ? 'yes' : 'no';
      var freed = 0;
      if (t.active === 'no') db.companies.forEach(function (c) { if (c.owner === t.name) { c.owner = ''; freed++; } });
      demoDb(db); return { ok: true, freed: freed };
    }
    case 'deleteCompany': {
      if (!lead) return err('FORBIDDEN');
      var di = db.companies.findIndex(function (x) { return x.id === p.id; });
      if (di < 0) return err('Company not found. Reload the page.');
      var gone = db.companies.splice(di, 1)[0];
      db.deleted = (db.deleted || []).concat([Object.assign({ deleted_at: now, deleted_by: me.name }, gone)]);
      db.log.push({ timestamp: now, company_id: gone.id, company: gone.company, raiser: me.name, action: 'Deleted company', stage_from: gone.stage, stage_to: '', note: '' });
      demoDb(db); return { ok: true, deleted: gone.id };
    }
    case 'comment': {
      if (!p.parent && !lead) return err('Only the head can start a comment. You can reply to one.');
      var cm = { id: 'M' + Date.now().toString(36), timestamp: now, author: me.name, to: p.parent ? '' : (p.to || 'Everyone'), company_id: p.company_id || '', company: p.company || '', text: p.text, parent: p.parent || '', status: p.parent ? '' : 'open' };
      db.comments.push(cm); demoDb(db); return { ok: true, comment: cm };
    }
    case 'commentStatus': {
      var cx = db.comments.find(function (x) { return x.id === p.id; });
      if (cx) cx.status = p.status; demoDb(db); return { ok: true };
    }
    case 'add': {
      var id = 'D' + String(Date.now()).slice(-6);
      var c = { id: id, project: p.project, direction: p.direction, company: p.company, description: p.description || '', contact: p.contact || '', owner: p.owner ? (lead ? p.owner : me.name) : '', stage: 'New', next_step: '', next_date: '', last_update: now, last_note: '', created: now.slice(0, 10) };
      db.companies.push(c);
      db.log.push({ timestamp: now, company_id: id, company: c.company, raiser: me.name, action: 'Added company', stage_from: '', stage_to: 'New', note: '' });
      demoDb(db); return { ok: true, company: c };
    }
  }
  var co = db.companies.find(function (x) { return x.id === p.id; });
  if (!co) return err('Company not found. Reload the page.');
  if ('owner' in p) {
    var to = p.owner || '';
    if (!(lead || to === me.name || (to === '' && co.owner === me.name))) return err('Only the head can take a company away from someone else.');
    co.owner = to;
  }
  var before = co.stage;
  if (p.stage) co.stage = p.stage;
  if ('next_step' in p) co.next_step = p.next_step || '';
  if ('next_date' in p) co.next_date = p.next_date || '';
  if (p.note) co.last_note = p.note;
  if (!/^(Took company|Released company|Assigned to |Unassigned)/.test(String(p.action || ''))) co.last_update = now;
  db.log.push({ timestamp: now, company_id: co.id, company: co.company, raiser: me.name, action: p.action || 'Update', stage_from: before, stage_to: co.stage, note: p.note || '' });
  demoDb(db); return { ok: true, company: co };
}

function demoDb(set) {
  if (set) { store('mrt-demo', JSON.stringify(set)); return set; }
  var raw = store('mrt-demo');
  if (raw) {
    try {
      var db = JSON.parse(raw);
      if (!db.comments) db.comments = demoComments();
      if (!db.team.some(function (m) { return m.role === 'Admin'; })) db.team.push({ name: 'Admin', role: 'Admin', active: 'yes' });
      return db;
    } catch (e) {}
  }
  return demoDb(demoSeed());
}

/* ================= helpers ================= */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return ymd(new Date()); }
function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
function daysSince(iso) { if (!iso) return Infinity; var t = Date.parse(iso); if (isNaN(t)) return Infinity; return Math.floor((Date.now() - t) / 864e5); }
function ago(iso) {
  if (!iso) return 'never';
  var t = Date.parse(iso); if (isNaN(t)) return iso;
  var m = Math.round((Date.now() - t) / 6e4);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  var h = Math.round(m / 60); if (h < 24) return h + ' h ago';
  var d = Math.round(h / 24); if (d === 1) return 'yesterday'; if (d < 30) return d + ' days ago';
  return new Date(t).toLocaleDateString();
}
function niceDate(s) {
  if (!s) return '';
  if (s === today()) return 'today';
  if (s === addDays(1)) return 'tomorrow';
  if (s === addDays(-1)) return 'yesterday';
  var d = new Date(s + 'T00:00:00'); if (isNaN(d)) return s;
  return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}
function initials(n) { return String(n || '?').trim().split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); }
function stCls(s) { return 'st-' + String(s || 'New').split(' ')[0]; }
function pill(s) { return '<span class="pill ' + stCls(s) + '">' + esc(s || 'New') + '</span>'; }
function inProject(c) { return S.project === 'All' || c.project === S.project; }
function isOverdue(c) { return c.next_date && c.next_date <= today() && CLOSED.indexOf(c.stage) < 0; }
function isStale(c) { return OPEN.indexOf(c.stage) >= 0 && daysSince(c.last_update) >= STALE; }
function companies() { return S.companies.filter(inProject); }
function byId(id) { return S.companies.find(function (c) { return c.id === id; }); }

function toast(msg) {
  var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
}

function viewMy() {

  var flagged = act.concat(quiet).map(function (c) { return c.id; });

  return h;
}

/* ================= view: team dashboard ================= */
function viewTeam() {
  var cs = companies();
  var count = function (f) { return cs.filter(f).length; };
  var inWork = count(function (c) { return OPEN.indexOf(c.stage) >= 0; });
  var nego = count(function (c) { return c.stage === 'Offer sent' || c.stage === 'Negotiating'; });
  var yes = count(function (c) { return c.stage === 'Confirmed'; });
  var no = count(function (c) { return c.stage === 'Refused'; });
  var untouched = count(function (c) { return (c.stage || 'New') === 'New'; });
  var unassigned = count(function (c) { return !c.owner; });
  var ids = cs.map(function (c) { return c.id; });
  var log = S.log.filter(function (l) { return ids.indexOf(l.company_id) >= 0 && l.action !== 'Took company' && l.action !== 'Released company'; });
  var weekAgo = Date.now() - 7 * 864e5;
  var yesWeek = log.filter(function (l) { return l.stage_to === 'Confirmed' && l.stage_from !== 'Confirmed' && Date.parse(l.timestamp) > weekAgo; }).length;

  var h = '<div class="kpis">' +
    kpi(cs.length, 'Companies in MR', untouched + ' not contacted yet · ' + unassigned + ' unassigned') +
    kpi(inWork, 'In progress', 'contacted, offer or follow-up') +
    kpi(nego, 'In negotiation', 'offer sent or following up') +
    kpi(yes, 'Confirmed', yesWeek ? '<span style="color:var(--good)">+' + yesWeek + ' this week</span>' : 'none new this week') +
    kpi(no, 'Refused', cs.length ? Math.round(no / Math.max(1, yes + no) * 100) + '% of closed' : '') + '</div>';

  // raisers
  var people = S.team.filter(function (m) { return m.active !== 'no' && (!isTracker(m.name) || cs.some(function (c) { return c.owner === m.name; })); }).map(function (m) {
    var own = cs.filter(function (c) { return c.owner === m.name; });
    var mylog = log.filter(function (l) { return l.raiser === m.name; });
    var last = mylog.reduce(function (a, l) { return l.timestamp > a ? l.timestamp : a; }, '');
    return {
      name: m.name, own: own.length,
      week: mylog.filter(function (l) { return Date.parse(l.timestamp) > weekAgo; }).length,
      work: own.filter(function (c) { return OPEN.indexOf(c.stage) >= 0; }).length,
      yes: own.filter(function (c) { return c.stage === 'Confirmed'; }).length,
      overdue: own.filter(function (c) { return isOverdue(c) || isStale(c); }).length,
      last: last
    };
  }).sort(function (a, b) { return (a.last || '') < (b.last || '') ? -1 : 1; });

  h += '<h2>Raisers <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">least recently active first</span></h2>';
  h += people.length ? '<div class="tbl-wrap"><table class="people"><thead><tr><th>Raiser</th><th>Last update</th><th class="num">Updates 7d</th><th class="num">Companies</th><th class="num hide-sm">In progress</th><th class="num">Confirmed</th><th class="num">Needs attention</th></tr></thead><tbody>' +
    people.map(function (p) {
      var d = daysSince(p.last), cls = d <= 2 ? 'ago-good' : d < STALE ? 'ago-warn' : 'ago-bad';
      return '<tr data-owner="' + esc(p.name) + '"><td class="who"><span class="avatar">' + esc(initials(p.name)) + '</span>' + esc(p.name) + '</td>' +
        '<td class="' + cls + '">' + esc(ago(p.last)) + '</td><td class="num">' + p.week + '</td><td class="num">' + p.own + '</td><td class="num hide-sm">' + p.work + '</td><td class="num">' + p.yes + '</td>' +
        '<td class="num">' + (p.overdue ? '<span class="flag bad">' + p.overdue + '</span>' : '<span class="muted">0</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>' : '<div class="empty">No raisers yet. They appear here after they open the site and add their name.</div>';

  // funnel by direction + activity sparkline
  var dirs = DIRS.slice(); cs.forEach(function (c) { if (c.direction && dirs.indexOf(c.direction) < 0) dirs.push(c.direction); });
  dirs = dirs.filter(function (d) { return cs.some(function (c) { return c.direction === d; }); });
  var max = Math.max.apply(null, dirs.map(function (d) { return cs.filter(function (c) { return c.direction === d; }).length; }).concat([1]));
  var funnel = dirs.map(function (d) {
    var g = cs.filter(function (c) { return c.direction === d; });
    var segs = STAGES.map(function (s) { var n = g.filter(function (c) { return (c.stage || 'New') === s; }).length; return n ? '<span class="b-' + s.split(' ')[0] + '" style="width:' + (n / max * 100) + '%" title="' + esc(s) + ': ' + n + '"></span>' : ''; }).join('');
    var ok = g.filter(function (c) { return c.stage === 'Confirmed'; }).length;
    return '<div class="funnel-row"><span>' + esc(d) + '</span><div class="bar">' + segs + '</div><span class="num" style="text-align:right"><b>' + ok + '</b><span class="muted">/' + g.length + '</span></span></div>';
  }).join('');

  var days = [];
  for (var i = 13; i >= 0; i--) { var day = addDays(-i); days.push({ d: day, n: log.filter(function (l) { return (l.timestamp || '').slice(0, 10) === day; }).length }); }
  var dmax = Math.max.apply(null, days.map(function (x) { return x.n; }).concat([1]));
  var total14 = days.reduce(function (a, x) { return a + x.n; }, 0);

  h += '<div class="grid2" style="margin-top:12px"><div class="panel"><div class="box-title">Pipeline by direction</div><p class="muted" style="margin:2px 0 6px;font-size:13px">Bar = companies by stage. Right: confirmed / total.</p>' + funnel +
    '<div class="legend">' + STAGES.map(pill).join('') + '</div></div>' +
    '<div class="panel"><div class="box-title">Updates per day</div><p class="muted" style="margin:2px 0 0;font-size:13px"><span class="num">' + total14 + '</span> updates in the last 14 days</p>' +
    '<div class="spark" role="img" aria-label="Updates per day, last 14 days">' + days.map(function (x, k) { return '<div' + (k === 13 ? ' class="today"' : '') + ' style="height:' + (x.n / dmax * 100) + '%" title="' + esc(niceDate(x.d)) + ': ' + x.n + '"></div>'; }).join('') + '</div>' +
    '<div class="spark-axis"><span>' + esc(niceDate(days[0].d)) + '</span><span>today</span></div></div></div>';

  // attention list
  var att = cs.filter(function (c) { return c.owner && (isOverdue(c) || isStale(c)); })
    .sort(function (a, b) { return daysSince(b.last_update) - daysSince(a.last_update); });
  h += '<h2>Needs attention <span class="pill st-Refused">' + att.length + '</span></h2>';
  h += att.length ? '<div class="list">' + att.slice(0, 30).map(function (c) { return cardHtml(c, { owner: true }); }).join('') + '</div>' : '<div class="empty">Nothing is overdue or going quiet.</div>';
  return h;
}
function kpi(v, l, d) { return '<div class="kpi"><div class="v">' + v + '</div><div class="l">' + esc(l) + '</div>' + (d ? '<div class="d muted">' + d + '</div>' : '') + '</div>'; }

/* ================= view: activity ================= */
function viewActivity() {
  var ids = companies().map(function (c) { return c.id; });
  var log = S.log.filter(function (l) { return ids.indexOf(l.company_id) >= 0; }).slice().reverse().slice(0, 150);
  if (!log.length) return '<div class="empty"><strong>No activity yet</strong>Every update a raiser logs shows up here, newest first.</div>';
  var h = '<div class="feed">', lastDay = '';

    if (d !== lastDay) { h += '<div class="daysep">' + esc(niceDate(d)) + '</div>'; lastDay = d; }
    var moved = l.stage_from && l.stage_to && l.stage_from !== l.stage_to;
    h += '<div class="ev"><span class="avatar">' + esc(initials(l.raiser)) + '</span><div class="what"><b>' + esc(l.raiser) + '</b> · ' + esc(l.action) + ' · <a href="#" data-open="' + esc(l.company_id) + '" style="color:inherit;font-weight:600">' + esc(l.company) + '</a>' +
      (moved ? ' ' + pill(l.stage_to) : '') + (l.note ? '<div class="note">' + esc(l.note) + '</div>' : '') + '</div><span class="when">' + esc(new Date(l.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })) + '</span></div>';
  });

/* ================= view: comments ================= */
// The head and trackers write comments to one raiser or to everyone, optionally about a company.
// Raisers see what is addressed to them, reply, and mark comments done.
// "Lead" = the head (Tracker role) or the Admin: can write comments, assign and delete companies
function isTracker(name) {
  if (!name || name === S.me) return S.role === 'Tracker' || S.role === 'Admin';
  var m = S.team.find(function (x) { return x.name === name; });
  return !!m && (m.role === 'Tracker' || m.role === 'Admin');
}
function seenKey() { return 'mrt-seen-' + S.me; }
function topVisible(c) { return isTracker() || c.author === S.me || c.to === S.me || c.to === 'Everyone' || !c.to; }
function threads() { return S.comments.filter(function (c) { return !c.parent && topVisible(c); }); }
function repliesOf(id) { return S.comments.filter(function (c) { return c.parent === id; }).sort(function (a, b) { return a.timestamp < b.timestamp ? -1 : 1; }); }
function lastActivity(c) { return repliesOf(c.id).reduce(function (a, r) { return r.timestamp > a ? r.timestamp : a; }, c.timestamp || ''); }
function unreadComments() {
  var seen = store(seenKey()) || '';
  var ids = threads().filter(function (c) { return c.status !== 'done'; }).map(function (c) { return c.id; });
  return S.comments.filter(function (c) {
    return c.author !== S.me && (c.timestamp || '') > seen && (ids.indexOf(c.id) >= 0 || ids.indexOf(c.parent) >= 0);
  });
}
function markCommentsSeen() {
  // remember what was new when this visit started, so it stays highlighted while reading
  if (S.seenSession !== S.me) { S.prevSeen = store(seenKey()) || ''; S.seenSession = S.me; }
  store(seenKey(), new Date().toISOString());
}
function commentNudge() {
  var n = unreadComments().length;
  if (!n || S.view === 'comments') return '';
  return '<div class="nudge"><span>' + n + ' new ' + (n === 1 ? 'comment' : 'comments') + (isTracker() ? '' : ' from the head') + '</span><button class="btn small" data-goto="comments">Read</button></div>';
}

function threadHtml(c) {
  var prev = S.view === 'comments' ? (S.prevSeen || '') : (store(seenKey()) || '');
  var reps = repliesOf(c.id);
  var isNew = function (x) { return x.author !== S.me && (x.timestamp || '') > prev; };
  var unread = c.status !== 'done' && (isNew(c) || reps.some(isNew));
  var to = c.to === S.me ? 'you' : (c.to || 'Everyone');
  return '<div class="cmt' + (c.status === 'done' ? ' done' : '') + (unread ? ' unread' : '') + '">' +
    '<div class="cmt-head"><span class="avatar">' + esc(initials(c.author)) + '</span><b>' + esc(c.author) + '</b><span class="muted">to ' + esc(to) + '</span>' +
      (c.status === 'done' ? '<span class="pill st-Confirmed">Done</span>' : '') + '<span class="when">' + esc(ago(c.timestamp)) + '</span></div>' +
    (c.company && S.open !== c.company_id ? '<button class="cmt-co" data-open="' + esc(c.company_id) + '">' + esc(c.company) + ' →</button>' : '') +
    '<div class="cmt-text">' + esc(c.text) + '</div>' +
    (reps.length ? '<div class="replies">' + reps.map(function (r) {
      return '<div class="reply"><b>' + esc(r.author) + '</b> <span class="muted">· ' + esc(ago(r.timestamp)) + '</span>\n' + esc(r.text) + '</div>';
    }).join('') + '</div>' : '') +
    '<form class="reply-form" data-parent="' + esc(c.id) + '"><input class="input" id="r-' + esc(c.id) + '" placeholder="Write a reply" aria-label="Reply" autocomplete="off">' +
      '<button class="btn small" type="submit">Reply</button>' +
      '<button class="btn small ghost" type="button" data-cstatus="' + esc(c.id) + '" data-status="' + (c.status === 'done' ? 'open' : 'done') + '">' + (c.status === 'done' ? 'Reopen' : 'Mark done') + '</button></form>' +
  '</div>';
}

function viewComments() {
  var tr = isTracker();
  var h = '';
  if (tr) {
    var raisers = S.team.filter(function (m) { return m.active !== 'no' && !isTracker(m.name); });
    h += '<form class="panel composer" id="c-form"><div class="box-title">Write a comment</div>' +
      '<div class="row2"><div class="field"><label for="c-to">To</label><select class="input" id="c-to">' + opt('Everyone', 'Everyone', '') + raisers.map(function (m) { return opt(m.name, m.name, ''); }).join('') + '</select></div>' +
      '<div class="field"><label for="c-co">About a company <span style="font-weight:400">(optional)</span></label><input class="input" id="c-co" list="co-list" placeholder="Start typing a name" autocomplete="off">' +
        '<datalist id="co-list">' + S.companies.map(function (c) { return '<option value="' + esc(c.company) + '">' + esc(c.direction + (c.owner ? ' · ' + c.owner : '')) + '</option>'; }).join('') + '</datalist></div></div>' +
      '<div class="field"><label for="c-text">Comment</label><textarea class="input" id="c-text" rows="3" placeholder="e.g. Great job this week. Please follow up with the coffee shops before Friday."></textarea></div>' +
      '<div><button class="btn primary" type="submit">Send comment</button></div></form>';
  } else {
    h += '<p class="lede">Comments from the head</p><p class="muted" style="margin:0 0 12px">Comments written to you or to the whole team. Reply if you have a question, and press <b>Mark done</b> once you have acted on one.</p>';
  }
  var all = threads();
  var counts = { open: all.filter(function (c) { return c.status !== 'done'; }).length, done: all.filter(function (c) { return c.status === 'done'; }).length, all: all.length };
  var list = all.filter(function (c) { return S.cFilter === 'all' || (S.cFilter === 'done' ? c.status === 'done' : c.status !== 'done'); })
    .sort(function (a, b) { return lastActivity(a) < lastActivity(b) ? 1 : -1; });
  h += '<div class="toolbar"><div class="seg" role="group" aria-label="Show">' + [['open', 'Open'], ['done', 'Done'], ['all', 'All']].map(function (f) {
    return '<button data-cfilter="' + f[0] + '" aria-pressed="' + (S.cFilter === f[0]) + '">' + f[1] + ' <span class="num">' + counts[f[0]] + '</span></button>';
  }).join('') + '</div></div>';
  if (!list.length) {
    h += '<div class="empty"><strong>' + (S.cFilter === 'done' ? 'Nothing marked done yet' : 'No open comments') + '</strong>' +
      (tr ? 'Comments you write appear here, with the raisers’ replies.' : 'When the head writes to you or to the whole team, it shows up here.') + '</div>';
  } else {
    h += '<div class="list">' + list.map(threadHtml).join('') + '</div>';
  }
  return h;
}

/* ================= company sheet ================= */
function openCompany(id) {
  var c = byId(id); if (!c) return;
  S.open = id;
  S.draft = { action: '', stage: c.stage || 'New', note: '', next_step: c.next_step || '', next_date: c.next_date || '' };
  renderSheet();
}
function openAdd() { S.open = '__add'; S.draft = { company: '', direction: S.fDir !== 'All' ? S.fDir : DIRS[0], project: S.project !== 'All' ? S.project : PROJECTS[0], description: '', contact: '', mine: true }; renderSheet(); }
function closeSheet() { S.open = null; S.draft = null; S.confirm = null; renderSheet(); }

function renderSheet() {
  var root = document.getElementById('sheet-root'); if (!root) return;
  if (!S.open) { root.innerHTML = ''; root.removeAttribute('data-for'); return; }
  var focusId = document.activeElement && document.activeElement.id;
  var old = root.querySelector('.sheet'), top = old ? old.scrollTop : 0, sameKey = root.getAttribute('data-for') === S.open;
  if (S.open === '__add') root.innerHTML = addSheet();
  else if (S.open === '__me') root.innerHTML = accountSheet();
  else root.innerHTML = companySheet();
  root.setAttribute('data-for', S.open);
  var sh = root.querySelector('.sheet');
  if (sh) { if (old && sameKey) sh.scrollTop = top; else sh.classList.add('enter'); }
  if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
}

function companySheet() {
  var c = byId(S.open); if (!c) return '';
  var d = S.draft, mine = c.owner === S.me;
  var hist = S.log.filter(function (l) { return l.company_id === c.id; }).slice().reverse().slice(0, 12);
  var changed = d.action || d.note.trim() || d.stage !== (c.stage || 'New') || d.next_step !== (c.next_step || '') || d.next_date !== (c.next_date || '');
  var lead = isTracker();
  var owner = c.owner
    ? '<span>Raiser: <b>' + esc(c.owner) + '</b></span>' + (mine ? '<button class="btn small ghost" data-release="' + esc(c.id) + '">Release</button>' : '')
    : '<span class="muted">Nobody is raising this company yet.</span><button class="btn small primary" data-take="' + esc(c.id) + '">Take it</button>';
  if (lead) {
    owner += '<label style="display:flex;gap:6px;align-items:center;font-size:13px;width:100%">Assign to <select class="input" id="assign" style="width:auto;padding:5px 8px">' +
      opt('', 'Nobody', c.owner || '') + S.team.filter(function (m) { return m.active !== 'no'; }).map(function (m) { return opt(m.name, m.name, c.owner || ''); }).join('') + '</select></label>';
  }
  var del = '';
  if (lead) {
    del = S.confirm && S.confirm.kind === 'delete' && S.confirm.id === c.id
      ? '<div class="box" style="border-color:var(--bad)"><div><b>Delete ' + esc(c.company) + '?</b> It disappears from the tracker and moves to the <b>Deleted</b> tab of the Google Sheet, so it can be put back from there.</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="color:var(--bad);border-color:var(--bad)" data-delete-yes="' + esc(c.id) + '">Delete company</button><button class="btn ghost" data-confirm-cancel>Cancel</button></div></div>'
      : '<button class="btn ghost" style="color:var(--bad);justify-self:start" data-delete="' + esc(c.id) + '">Delete this company</button>';
  }

  return '<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">' +
    '<div class="sheet-head"><div><h3 id="sh-title">' + esc(c.company) + '</h3><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">' + pill(c.stage) + '<span class="chip">' + esc(c.direction) + '</span><span class="chip">' + esc(c.project) + '</span></div></div><button class="close" data-close aria-label="Close">×</button></div>' +
    '<div class="box"><div class="owner-row">' + owner + '</div>' +
      (c.description ? '<div class="muted" style="font-size:14px">' + esc(c.description) + '</div>' : '') +
      (c.contact ? '<div class="contact"><span class="val">' + esc(c.contact) + '</span><button class="btn small" data-copy="' + esc(c.contact) + '">Copy</button></div>' : '') +
    '</div>' + companyComments(c) +
    '<div class="box"><div class="box-title">What did you just do?</div><div class="actions">' + ACTIONS.map(function (a) {
      return '<button class="act ' + (a.cls || '') + '" data-act="' + esc(a.a) + '" aria-pressed="' + (d.action === a.a) + '">' + esc(a.a) + '<small>' + esc(a.hint) + '</small></button>';
    }).join('') + '</div>' +
      '<div class="field"><label for="d-note">What happened? <span style="font-weight:400">(optional)</span></label><textarea class="input" id="d-note" rows="2" placeholder="e.g. Talked to the manager, she asked for the deck in Russian">' + esc(d.note) + '</textarea></div>' +
      '<div class="field"><label>Stage</label><div class="stages">' + STAGES.map(function (s) { return '<button class="pill ' + stCls(s) + '" data-stage="' + esc(s) + '" aria-pressed="' + (d.stage === s) + '">' + esc(s) + '</button>'; }).join('') + '</div></div>' +
    '</div>' +
    '<div class="box"><div class="box-title">Next step</div><div class="row2"><input class="input" id="d-next" placeholder="e.g. Call back about dates" value="' + esc(d.next_step) + '" aria-label="Next step"><input class="input" id="d-date" type="date" value="' + esc(d.next_date) + '" aria-label="Next step date"></div>' +
      '<div class="quick">' + [['Tomorrow', 1], ['In 3 days', 3], ['Next week', 7]].map(function (q) { return '<button class="btn small" data-quick="' + q[1] + '">' + q[0] + '</button>'; }).join('') + (d.next_date ? '<button class="btn small ghost" data-quick="clear">Clear</button>' : '') + '</div></div>' +
    '<button class="btn primary" id="save-upd" ' + (!changed || S.busy ? 'disabled' : '') + ' style="padding:12px">' + (S.busy ? 'Saving…' : 'Save update') + '</button>' +
    '<div class="box"><div class="box-title">History</div>' + (hist.length ? '<div class="hist">' + hist.map(function (l) {
      return '<div class="h"><b>' + esc(l.action) + '</b> · ' + esc(l.raiser) + ' <span class="muted">· ' + esc(ago(l.timestamp)) + '</span>' + (l.stage_from !== l.stage_to && l.stage_to ? ' ' + pill(l.stage_to) : '') + (l.note ? '<div class="muted" style="white-space:pre-wrap">' + esc(l.note) + '</div>' : '') + '</div>';
    }).join('') + '</div>' : '<div class="muted" style="font-size:14px">No updates yet.</div>') + '</div>' +
    del +
  '</div></div>';
}

function companyComments(c) {
  var cms = S.comments.filter(function (x) { return !x.parent && x.company_id === c.id && topVisible(x); })
    .sort(function (a, b) { return a.timestamp < b.timestamp ? 1 : -1; });
  var tr = isTracker();
  if (!cms.length && !tr) return '';
  return '<div class="box"><div class="box-title">Comments from the head</div>' +
    (cms.length ? '<div class="list">' + cms.map(threadHtml).join('') + '</div>' : '') +
    (tr ? '<form id="cc-form" class="reply-form"><input class="input" id="cc-text" placeholder="Comment to ' + esc(c.owner || 'everyone') + ' about this company" autocomplete="off" aria-label="New comment"><button class="btn small primary" type="submit">Send</button></form>' : '') +
  '</div>';
}

function addSheet() {
  var d = S.draft;
  return '<div class="scrim" data-scrim><form class="sheet" id="add-form" role="dialog" aria-modal="true" aria-labelledby="add-title">' +
    '<div class="sheet-head"><h3 id="add-title">Add a company</h3><button type="button" class="close" data-close aria-label="Close">×</button></div>' +
    '<div class="box">' +
    '<div class="field"><label for="a-name">Company name</label><input class="input" id="a-name" required value="' + esc(d.company) + '"></div>' +
    '<div class="row2"><div class="field"><label for="a-dir">Direction</label><select class="input" id="a-dir">' + DIRS.map(function (x) { return opt(x, x, d.direction); }).join('') + '</select></div>' +
    '<div class="field"><label for="a-proj">Project</label><select class="input" id="a-proj">' + PROJECTS.map(function (x) { return opt(x, x, d.project); }).join('') + '</select></div></div>' +
    '<div class="field"><label for="a-desc">What they do</label><input class="input" id="a-desc" placeholder="e.g. coffee shop, IELTS school" value="' + esc(d.description) + '"></div>' +
    '<div class="field"><label for="a-contact">Contact</label><input class="input" id="a-contact" placeholder="phone, Instagram, email, contact person" value="' + esc(d.contact) + '"></div>' +
    '<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="a-mine"' + (d.mine ? ' checked' : '') + '> I will raise this company</label>' +
    '</div><button class="btn primary" type="submit" style="padding:12px" ' + (S.busy ? 'disabled' : '') + '>' + (S.busy ? 'Adding…' : 'Add company') + '</button></form></div>';
}

/* ================= events ================= */
document.addEventListener('click', function (e) {
  var t = e.target.closest('button, a, tr[data-open], tr[data-owner], [data-scrim]');
  if (!t) return;
  if (t.hasAttribute('data-scrim')) { if (e.target === t) closeSheet(); return; }
  var ds = t.dataset;

  if (ds.view) { location.hash = ds.view; return; }
  if (ds.goto) { location.hash = ds.goto; return; }
  if (t.id === 'account') { S.open = '__me'; renderSheet(); return; }
  if (t.id === 'logout') {
    var tok = S.token;
    api('POST', { action: 'logout', token: tok }).catch(function () {});
    logoutLocal(''); load(); toast('Logged out'); return;
  }
  if (t.id === 'change-code') { S.code = ''; store('mrt-code', null); logoutLocal(''); render(); return; }
  if (t.id === 'reset-demo') { store('mrt-demo', null); load(); toast('Demo data reset'); return; }
  if (ds.auth) { S.authMode = ds.auth; S.error = ''; render(); return; }
  if ('confirmCancel' in ds) { S.confirm = null; renderSheet(); return; }
  if (ds.delete) { S.confirm = { kind: 'delete', id: ds.delete }; renderSheet(); return; }
  if (ds.deleteYes) {
    var dc = byId(ds.deleteYes);
    save({ action: 'deleteCompany', id: ds.deleteYes }, 'Deleted ' + (dc ? dc.company : 'company')).then(function () {
      S.companies = S.companies.filter(function (c) { return c.id !== ds.deleteYes; });
      S.confirm = null; closeSheet(); render();
    }, function () {});
    return;
  }
  if ('dismissReset' in ds) { S.resetResult = null; render(); return; }
  if (ds.person) {
    var who = ds.name;
    if (ds.person === 'cancel') { S.confirm = null; render(); return; }
    if (ds.person === 'remove' || ds.person === 'reset') { S.confirm = { kind: ds.person, name: who }; render(); return; }
    S.confirm = null;
    if (ds.person === 'remove-yes') save({ action: 'setActive', name: who, active: 'no' }).then(function (r) { toast(who + ' removed' + (r.freed ? '. ' + r.freed + ' companies are unassigned now.' : '')); }, function () {});
    if (ds.person === 'restore') save({ action: 'setActive', name: who, active: 'yes' }, who + ' restored').catch(function () {});
    if (ds.person === 'reset-yes') save({ action: 'resetPin', name: who }).then(function (r) { S.resetResult = { name: who, pin: r.pin }; render(); }, function () {});
    return;
  }
  if (ds.take) {
    e.stopPropagation();
    var co = byId(ds.take);
    save({ action: 'Took company', id: ds.take, owner: S.me }, 'You are now raising ' + co.company).then(function () { if (S.open) openCompany(ds.take); });
    return;
  }
  if (ds.release) { save({ action: 'Released company', id: ds.release, owner: '' }, 'Released'); return; }
  if (ds.owner) { S.fOwner = ds.owner; S.fDir = 'All'; S.fStage = 'All'; S.q = ''; location.hash = 'all'; return; }
  if (ds.open) { e.preventDefault(); openCompany(ds.open); return; }
  if (ds.close !== undefined) { closeSheet(); return; }
  if (ds.copy) {
    var txt = ds.copy;
    try { navigator.clipboard.writeText(txt).then(function () { toast('Copied'); }, function () { selectText(t); }); } catch (err) { selectText(t); }
    return;
  }
  if (ds.act) {
    var a = ACTIONS.find(function (x) { return x.a === ds.act; });
    var c = byId(S.open);
    if (S.draft.action === a.a) { S.draft.action = ''; S.draft.stage = c.stage || 'New'; }
    else {
      S.draft.action = a.a;
      // Move forward only. Agreed/refused always close.
      var cur = STAGES.indexOf(c.stage || 'New');
      S.draft.stage = (a.cls || STAGES.indexOf(a.stage) > cur || CLOSED.indexOf(c.stage) >= 0) ? a.stage : (c.stage || 'New');
      if (a.cls) { S.draft.next_step = ''; S.draft.next_date = ''; }
    }
    renderSheet(); return;
  }
  if (ds.stage) { S.draft.stage = ds.stage; renderSheet(); return; }
  if (ds.quick) { S.draft.next_date = ds.quick === 'clear' ? '' : addDays(+ds.quick); if (ds.quick === 'clear') S.draft.next_step = ''; renderSheet(); return; }
  if (ds.cfilter) { S.cFilter = ds.cfilter; render(); return; }
  if (ds.cstatus) { save({ action: 'commentStatus', id: ds.cstatus, status: ds.status }, ds.status === 'done' ? 'Marked done' : 'Reopened').catch(function () {}); return; }
  if (t.id === 'save-upd') { submitUpdate(); return; }
  if (t.id === 'add-co') { openAdd(); return; }
  if (t.id === 'more') { S.limit += 60; render(); return; }
});

function selectText(btn) { var v = btn.parentNode.querySelector('.val'); if (!v) return; var r = document.createRange(); r.selectNodeContents(v); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press copy on your keyboard.'); }

function submitUpdate() {
  var c = byId(S.open), d = S.draft;
  if (c.owner && c.owner !== S.me) { /* logging on someone else's company is allowed, it is signed with your name */ }
  var p = { id: c.id, action: d.action || (d.stage !== c.stage ? 'Changed stage' : d.note.trim() ? 'Note' : 'Updated next step'), note: d.note.trim() };
  if (d.stage !== (c.stage || 'New')) p.stage = d.stage;
  if (d.next_step !== (c.next_step || '')) p.next_step = d.next_step.trim();
  if (d.next_date !== (c.next_date || '')) p.next_date = d.next_date;
  if (!c.owner) p.owner = S.me; // logging work on an unassigned company makes it yours
  if (d.next_step.trim() && !d.next_date) p.next_date = addDays(1), p.next_step = d.next_step.trim();
  save(p, 'Saved: ' + c.company).then(closeSheet, function () {});
}

document.addEventListener('input', function (e) {
  var id = e.target.id;
  if (id === 'q') { S.q = e.target.value; S.limit = 60; rerenderMain(); return; }
  if (!S.draft) return;
  if (id === 'd-note') S.draft.note = e.target.value;
  if (id === 'd-next') S.draft.next_step = e.target.value;
  if (id === 'd-date') S.draft.next_date = e.target.value;
  if (id === 'a-name') S.draft.company = e.target.value;
  if (id === 'a-desc') S.draft.description = e.target.value;
  if (id === 'a-contact') S.draft.contact = e.target.value;
  if (/^d-/.test(id)) { var b = document.getElementById('save-upd'); if (b) b.disabled = S.busy; }
});

document.addEventListener('change', function (e) {
  var id = e.target.id, v = e.target.value;
  if (id === 'proj') { S.project = v; store('mrt-project', v); render(); }
  if (id === 'f-dir') { S.fDir = v; S.limit = 60; rerenderMain(); }
  if (id === 'f-stage') { S.fStage = v; S.limit = 60; rerenderMain(); }
  if (id === 'f-owner') { S.fOwner = v; S.limit = 60; rerenderMain(); }
  if (id === 'd-date') { S.draft.next_date = v; renderSheet(); }
  if (id === 'c-co') { // picking a company addresses the comment to whoever is raising it
    var pc = S.companies.find(function (c) { return c.company.trim().toLowerCase() === v.trim().toLowerCase(); });
    var sel = document.getElementById('c-to');
    if (pc && pc.owner && sel && [].some.call(sel.options, function (o) { return o.value === pc.owner; })) sel.value = pc.owner;
  }
  if (id === 'assign' && S.open) {
    var ac = byId(S.open);
    save({ action: v ? 'Assigned to ' + v : 'Unassigned', id: S.open, owner: v }, v ? ac.company + ' assigned to ' + v : 'Nobody is raising ' + ac.company + ' now').catch(function () {});
  }
  if (e.target.dataset && e.target.dataset.roleOf) {
    var rn = e.target.dataset.roleOf;
    save({ action: 'setRole', name: rn, role: v }, rn + ' is now ' + roleLabel(v)).catch(function () { render(); });
  }
  if (S.draft && id === 'a-dir') S.draft.direction = v;
  if (S.draft && id === 'a-proj') S.draft.project = v;
  if (S.draft && id === 'a-mine') S.draft.mine = e.target.checked;
});

function rerenderMain() {
  var main = document.getElementById('main'); if (!main || S.view !== 'all') return render();
  var q = document.getElementById('q'), pos = q && q.selectionStart;
  main.innerHTML = viewAll();
  var nq = document.getElementById('q'); if (nq && document.activeElement !== nq && q) { nq.focus(); try { nq.setSelectionRange(pos, pos); } catch (err) {} }
}

document.addEventListener('submit', function (e) {
  e.preventDefault();
  if (e.target.id === 'code-form') {
    S.code = document.getElementById('code-in').value.trim(); store('mrt-code', S.code); S.error = ''; S.loaded = false;
    app.innerHTML = '<div class="loading">Checking…</div>'; load();
    return;
  }
  if (e.target.id === 'login-form' || e.target.id === 'register-form') {
    var isReg = e.target.id === 'register-form';
    var name = document.getElementById(isReg ? 'r-name' : 'l-name').value.trim().replace(/\s+/g, ' ');
    var pin = document.getElementById(isReg ? 'r-pin' : 'l-pin').value.trim();
    if (!name) { S.error = 'Choose your name first.'; render(); return; }
    if (isReg && pin !== document.getElementById('r-pin2').value.trim()) { S.error = 'The two PINs are different. Type them again.'; render(); return; }
    S.busy = true; S.error = ''; render();
    api('POST', { action: isReg ? 'register' : 'login', name: name, pin: pin }).then(function (r) {
      S.busy = false; setSession(r.token, r.me); S.loaded = false;
      app.innerHTML = '<div class="loading">Loading…</div>';
      return load().then(function () { toast(isReg ? 'Welcome, ' + r.me.name + (r.me.role === 'Admin' ? '. You are the admin.' : '') : 'Logged in'); });
    }).catch(function (err) {
      S.busy = false; S.error = err.message;
      if (err.code === 'WRONG_CODE') { S.code = ''; store('mrt-code', null); }
      render();
    });
    return;
  }
  if (e.target.id === 'pin-form') {
    var oldPin = document.getElementById('p-old').value.trim(), np = document.getElementById('p-new').value.trim();
    if (np !== document.getElementById('p-new2').value.trim()) { toast('The two new PINs are different'); return; }
    if (!/^[A-Za-z0-9]{4,12}$/.test(np)) { toast('The PIN must be 4–12 letters or digits'); return; }
    save({ action: 'changePin', oldPin: oldPin, newPin: np }, 'PIN changed').then(closeSheet, function () {});
    return;
  }
  if (e.target.id === 'c-form') {
    var text = document.getElementById('c-text').value.trim();
    var to = document.getElementById('c-to').value;
    var coName = document.getElementById('c-co').value.trim().toLowerCase();
    if (!text) { toast('Write the comment first'); return; }
    var co = coName ? S.companies.find(function (c) { return c.company.trim().toLowerCase() === coName; }) : null;
    if (coName && !co) { toast('No company with that name. Pick one from the list or leave it empty.'); return; }
    save({ action: 'comment', to: to, text: text, company_id: co ? co.id : '', company: co ? co.company : '' }, 'Comment sent to ' + (to === 'Everyone' ? 'everyone' : to)).catch(function () {});
    return;
  }
  if (e.target.id === 'cc-form') {
    var cc = byId(S.open), ctext = document.getElementById('cc-text').value.trim();
    if (!cc || !ctext) return;
    save({ action: 'comment', to: cc.owner || 'Everyone', text: ctext, company_id: cc.id, company: cc.company }, 'Comment sent').catch(function () {});
    return;
  }
  if (e.target.classList.contains('reply-form')) {
    var rtext = e.target.querySelector('input').value.trim();
    if (!rtext) return;
    save({ action: 'comment', parent: e.target.getAttribute('data-parent'), text: rtext }, 'Reply sent').catch(function () {});
    return;
  }
  if (e.target.id === 'add-form') {
    var d = S.draft;
    if (!d.company.trim()) return;
    var dup = S.companies.find(function (c) { return c.company.trim().toLowerCase() === d.company.trim().toLowerCase() && c.direction === d.direction; });
    if (dup) { toast(dup.company + ' is already in ' + dup.direction + (dup.owner ? ' (' + dup.owner + ')' : '')); openCompany(dup.id); return; }
    save({ action: 'add', company: d.company.trim(), direction: d.direction, project: d.project, description: d.description.trim(), contact: d.contact.trim(), owner: d.mine ? S.me : '' }, 'Added ' + d.company.trim())
      .then(closeSheet, function () {});
  }
});

document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.open) closeSheet(); });
window.addEventListener('hashchange', function () { S.view = (location.hash || '#my').slice(1); S.open = null; S.seenSession = null; render(); window.scrollTo(0, 0); });
// keep everyone's screen fresh: reload data every minute while the tab is visible,
// but never while someone is in the middle of typing
function typing() { var a = document.activeElement; return !!a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && !!a.value; }
setInterval(function () { if (document.visibilityState === 'visible' && !S.open && !S.busy && S.loaded && !typing()) load(true); }, 60000);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && !S.open && S.loaded && !typing()) load(true); });

load();
})();
</script>
</body>
</html>
